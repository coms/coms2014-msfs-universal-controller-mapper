  actions: {on: LANDING_LIGHTS_ON, off: LANDING_LIGHTS_OFF, press: LANDING_LIGHTS_TOGGLE}
- id: taxi_lights
  name: Taxi lights
  roles: [lights.taxi, lights, switch]
  preferred_kinds: [switch]
  actions: {press: TOGGLE_TAXI_LIGHTS}
- id: nav_lights
  name: Navigation lights
  roles: [lights.nav, lights, switch]
  preferred_kinds: [switch]
  actions: {press: TOGGLE_NAV_LIGHTS}
- id: strobe_lights
  name: Strobe lights
  roles: [lights.strobe, lights, switch]
  preferred_kinds: [switch]
  actions: {press: STROBES_TOGGLE}

# --- Autopilot ---------------------------------------------------------------
- id: ap_master
  name: Autopilot master
  roles: [autopilot.master, autopilot]
  preferred_kinds: [button]
  actions: {press: AP_MASTER}
- id: ap_heading
  name: Autopilot heading mode
  roles: [autopilot.hdg, autopilot]
  preferred_kinds: [button]
  actions: {press: AP_PANEL_HEADING_HOLD}
- id: ap_nav
  name: Autopilot NAV mode
  roles: [autopilot.nav, autopilot]
  preferred_kinds: [button]
  actions: {press: AP_NAV1_HOLD}
- id: ap_approach
  name: Autopilot approach mode
  roles: [autopilot.apr, autopilot]
  preferred_kinds: [button]
  actions: {press: AP_APR_HOLD}
- id: ap_altitude
  name: Autopilot altitude hold
  roles: [autopilot.alt, autopilot]
  preferred_kinds: [button]
  actions: {press: AP_PANEL_ALTITUDE_HOLD}
- id: ap_vs
  name: Autopilot vertical speed mode
  roles: [autopilot.vs, autopilot]
  preferred_kinds: [button]
  actions: {press: AP_PANEL_VS_HOLD}
- id: ap_disconnect
  name: Autopilot disconnect
  roles: [autopilot.disconnect, yoke.button]
  preferred_kinds: [button]
  actions: {press: AUTOPILOT_OFF}
- id: autothrottle_arm
  name: Autothrottle arm
  roles: [autothrottle, autopilot.ias]
  preferred_kinds: [button]
  actions: {press: AUTO_THROTTLE_ARM}
- id: heading_bug
  name: Heading bug
  roles: [encoder.hdg, encoder]
  preferred_kinds: [encoder]
  actions: {inc: HEADING_BUG_INC, dec: HEADING_BUG_DEC}
- id: ap_altitude_select
  name: Selected altitude
  roles: [encoder.alt, encoder]
  preferred_kinds: [encoder]
  actions: {inc: AP_ALT_VAR_INC, dec: AP_ALT_VAR_DEC}
- id: ap_vs_select
  name: Selected vertical speed
  roles: [encoder.vs, encoder]
  preferred_kinds: [encoder]
  actions: {inc: AP_VS_VAR_INC, dec: AP_VS_VAR_DEC}
